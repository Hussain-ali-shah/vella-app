<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
     <div class="engine-creater engine-status">
        <div class="engine-box">
        </div>
    </div>
    <div class="page-container">
        <nav>
            <div class="nav1-box-logo"><span>StudentValley<i class="fa-solid fa-book"></i></span>
                <h4>For Education</h4>
            </div>
            <div class="nav1-box-text">
                <div class="box-con">
                    <div class="box">Home</div>
                    <div class="box">Tasks</div>
                    <div class="box">Essay</div>
                    <div class="box">VMl AI</div>
                    </ul>
                </div>
                </div>
        </nav>
        <div class="container">
            <nav class="nav2">
                <div class="nav2-box">
                      <input type="text" placeholder="search" required class="serach-engine">
                      <button class="search-btn">search</button>
                    </div>
            </nav>
            <div class="max-box center1 center1-status" >
                <div class="themebox">
                    <h1 class="info">Welcome</h1>
                    <button class="theme"><i class="fa-solid fa-moon"></i></button>
                </div>
                <div class="cen-1">
                    <div class="cen-text-box">
                        <h1 class="cen-1-text">Thanks for connected with us</h1>
                        <h1 class="cen-2-text">let's talk with Vella ai</h1>
                    </div>
                    <div class="ai-box ai-hide">
                        <div class="texter-display">

                        </div>
                    </div>
                    <div class="vella-ai">
                        <input type="text" placeholder="please text here" class="vella-value" required>
                        <button class="vella-btn"><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>
            </div>
            <div class="max-box center2 center2-status">
                <div class="taskbox">
                    <input type="text" class="task-input" placeholder="add task">
                    <input type="datetime-local" class="date-time">
                    <button class="add-task">add task</button>
                </div>
                <div class="cen-2">
                </div>
            </div>
            <div class="max-box center3 center3-status" >
                  <div class="button-3">
                    <button class="add-essay">Add new Essay</button>
                </div>
                <div class="cen-3 cen-3-status">
                    <h1 class="cen-3-text">please add Essay box is empty</h1>
                </div>
                <div class="cen3-add-input cen3-add-input-status">
                    <input type="text" placeholder="title" class="title">
                    <textarea type="text" placeholder="add eassay" class="essay-Input"></textarea>
                    <div class="cen3-add-input2">
                        <button class="essay-back">Back</button>
                        <button class="essay-saver">Add</button>
                    </div>
                </div>
            </div>
            <div class="max-box center4 center4-status">
                <div class="center4-heading">
                    <h1 class="center4-text">vella Master <br> langauge AI</h1>
                </div>
                <form class="submint-form">
                    <div class="trans-box-container">
                    <div class="trans-box">
                        <div class="from-text">from</div>
                        <textarea name="" class="from" placeholder="please text here"></textarea>
                        <div class="cen-4-con">
                            <img src="" alt="">
                            <select name="select" class="from-select">
                            </select>
                        </div>
                    </div>
                    <div class="trans-box">
                        <div class="to-text">to</div>
                        <textarea  class="to"> </textarea>
                        <div class="cen-4-con">
                            <img src="" alt="">
                            <select name="select" class="to-select">
                            </select>
                        </div>
                    </div>
            </div>
            <div class="submint-box">
                <button class="submint submint-hide">translate</button>
            </div>
            </form>
        </div>
        </div>
    </div>
    <script src="https://js.puter.com/v2/"></script>
     <script src="https://js.puter.com/v2/"></script>
     <script src="ln.js"></script>
      <script src="script.js"></script>
</body>
</html>
