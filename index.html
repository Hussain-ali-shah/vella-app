<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="text"><h1>Currency Converter</h1></div>
    <div class="container">
     <div class="currency-container">
      <form action="">
        <div class="amount">
            <p>Enter Amount</p>
            <input type="text" placeholder="000">
        </div>
        <div class="dropDown">
        <div class="from img-box">
             <img src="https://flagsapi.com/US/flat/64.png "alt=>
                <div class="p-from"> From
                <select name="select-from" class="select-from">
                </select>
            </div>
            </div>
          <div class="arrow-box">
            <i class="fa-solid fa-arrow-right"></i>
            <i class="fa-solid fa-arrow-left"></i>
          </div>
             <div class="to img-box">
                <img src="https://flagsapi.com/PK/flat/64.png"alt="">
                <div class="p-from"> To
                 <select name="select-to" class="select-to"></select>
                </div>
            </div>
        </div>
              <p class="result"></p>
        <button>Convert</button>
      </form>
        </div>
    </div>
        </div>
     <script src="code.js"></script>
     <script src="app.js"></script>
</body>
</html>
